name: Generate trips GeoJSON

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv numpy geojson

      # Fetches any trips from Supabase not already in trips.geojson, and
      # computes speed, road quality, braking, and crash/fall detection for
      # them in one pass. This used to be split across
      # csv_to_geojson_converter.py (fetch) and integrated_processor.py
      # (process) — that local/CSV pipeline is retired (see
      # archive/legacy-local-pipeline/), and generate_trips_geojson.py now
      # does its own Supabase fetch + processing directly.
      #
      # Skip-list: load_existing_output() in generate_trips_geojson.py reads
      # the trips.geojson already committed to the repo and treats every
      # trip_id already present as done — so previously-fetched trips are
      # never re-fetched or re-processed, without needing a separate
      # trips_metadata.json to track it.
      - name: Generate trips.geojson
        env:
          SUPABASE_HOST:     ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:     ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:       ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:     ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python generate_trips_geojson.py

      # Reads trips.geojson only — no Supabase connection, no dependency on
      # the retired local pipeline. Unchanged from before.
      - name: Average road segments
        run: python road_averaging.py

      # Previously never ran in this workflow — braking_hotspots.json was
      # only ever produced by a manual local run of master_pipeline.py
      # (which is itself interactive and can't run in CI). Added here so
      # the scheduled job actually keeps it up to date.
      - name: Generate braking hotspots
        run: python generate_braking_hotspots.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # trips_metadata.json and processing_versions.json are gone —
          # both were only ever written by the now-archived
          # csv_to_geojson_converter.py / integrated_processor.py, and
          # nothing in the current pipeline reads or writes them.
          TRACKED_PATHS="trips.geojson road_segments_averaged.json braking_hotspots.json"

          git add $TRACKED_PATHS

          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          git commit -m "chore: regenerate trip data [skip ci]"

          # Pull latest remote changes, keep our freshly generated files
          git fetch origin main
          git checkout origin/main -- .
          git checkout HEAD -- $TRACKED_PATHS
          git add $TRACKED_PATHS
          git commit --allow-empty -m "chore: regenerate trip data [skip ci]"
          git push origin HEAD:main
